name: Lua checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  lua_syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Syntax-check all Lua sources
        run: |
          # loadfile() compiles each file (catching syntax errors) without
          # executing it, so this is fast and avoids the heavy engine/test
          # runtime that exhausts LuaJIT's memory ceiling.
          find src -name '*.lua' > /tmp/lua_files.txt
          luajit -e 'local n=0; for f in io.lines("/tmp/lua_files.txt") do local ok,err=loadfile(f); if not ok then io.stderr:write("SYNTAX ERROR: "..err.."\n"); os.exit(1) end; n=n+1 end; print("OK: "..n.." Lua files compiled")'
  run_specs:
    # Same container and shard layout as upstream's test workflow, so spec
    # runs stay comparable across syncs. Known pre-existing failures from the
    # 0.20 sync are marked pending() in the spec files rather than excluded
    # here, so the rest of each file still runs.
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          set -eu
          shard_count=3
          shard="${{ matrix.shard }}"
          index=0
          found=0
          for spec in $(find spec/System -name '*_spec.lua' | sort); do
            if [ $((index % shard_count)) -eq "$shard" ]; then
              found=1
              echo "::group::$spec"
              if ! busted --lua=luajit "../$spec"; then
                echo "::endgroup::"
                exit 1
              fi
              echo "::endgroup::"
            fi
            index=$((index + 1))
          done
          [ "$found" -eq 1 ]
  version_sync:
    # RELEASE.md ("Versioning"): the macOS port build counter lives in both
    # macos/Info.plist.in (CFBundleVersion) and src/Modules/Main.lua
    # (macPortBuild) and the two must stay in sync.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check macPortBuild matches CFBundleVersion
        run: |
          set -eu
          plist_build="$(awk '/CFBundleVersion/{getline; gsub(/[^0-9]/, ""); print; exit}' macos/Info.plist.in)"
          lua_build="$(sed -n 's/^local macPortBuild = \([0-9]\{1,\}\).*/\1/p' src/Modules/Main.lua)"
          echo "Info.plist.in CFBundleVersion=${plist_build}  Main.lua macPortBuild=${lua_build}"
          if [ -z "$plist_build" ] || [ -z "$lua_build" ] || [ "$plist_build" != "$lua_build" ]; then
            echo "Port build counter mismatch: keep CFBundleVersion (macos/Info.plist.in) and macPortBuild (src/Modules/Main.lua) in sync — see RELEASE.md (Versioning)." >&2
            exit 1
          fi
