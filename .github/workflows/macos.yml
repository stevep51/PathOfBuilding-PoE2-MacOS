name: macOS build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build_macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja sdl3 luajit curl zlib zstd
      - name: Build app
        run: tools/macos/build_app.sh
      - name: Package app
        run: tools/macos/package_app.sh
      - name: Verify app is self-contained
        run: |
          set -euo pipefail
          app="dist/macos-arm64/Path of Building (PoE2).app"
          binary="${app}/Contents/MacOS/PathOfBuilding-PoE2"
          echo "== otool -L ${binary}"
          otool -L "${binary}"
          if otool -L "${binary}" "${app}/Contents/Frameworks/"*.dylib | grep -E '/opt/homebrew|/usr/local'; then
            echo "error: packaged app links against Homebrew paths" >&2
            exit 1
          fi
          if otool -l "${binary}" | grep -A2 LC_RPATH | grep -E '/opt/homebrew|/usr/local'; then
            echo "error: packaged binary carries Homebrew rpaths" >&2
            exit 1
          fi
          codesign --verify --deep --strict "${app}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathOfBuilding-PoE2-macos-arm64
          path: |
            dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip
            dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip.sha256

