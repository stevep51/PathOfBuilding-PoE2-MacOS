name: macOS build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build_macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja sdl3 luajit curl zlib zstd
      - name: Build app
        run: tools/macos/build_app.sh
      - name: Package app
        run: tools/macos/package_app.sh
      - name: Verify packaged app
        run: |
          set -euo pipefail
          app="dist/macos-arm64/Path of Building (PoE2).app"
          binary="${app}/Contents/MacOS/PathOfBuilding-PoE2"
          plutil -lint macos/Info.plist.in
          # The bundle must carry its own Lua sources and a platform-tagged
          # manifest, otherwise the shipped app falls back to dev mode
          # (repo-relative sources, Dev Mode banner, data stored in-bundle).
          test -f "$app/Contents/Resources/src/Launch.lua"
          grep -q 'platform="macos-arm64"' "$app/Contents/Resources/manifest.xml"
          # The bundle must also be self-contained: a Homebrew install name
          # aborts at launch on a machine without the formulae, and a Homebrew
          # rpath is searched first, so it shadows the bundled copy on a
          # machine that has them.
          echo "== otool -L ${binary}"
          otool -L "${binary}"
          if otool -L "${binary}" "${app}/Contents/Frameworks/"*.dylib | grep -E '/opt/homebrew|/usr/local'; then
            echo "error: packaged app links against Homebrew paths" >&2
            exit 1
          fi
          if otool -l "${binary}" | grep -A2 LC_RPATH | grep -E '/opt/homebrew|/usr/local'; then
            echo "error: packaged binary carries Homebrew rpaths" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathOfBuilding-PoE2-macos-arm64
          path: |
            dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip
            dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip.sha256

